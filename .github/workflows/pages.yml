name: Publish report to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "reports/Q4_2026/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install marimo
        run: pip install "marimo==0.14.17" "plotly==5.23.0" numpy

      - name: Export notebook as html-wasm
        run: |
          marimo export html-wasm reports/Q4_2026/marimo_report.py \
            -o site/index.html --mode run --no-sandbox --force

      - name: Copy data and figures next to the page
        run: |
          mkdir -p site/data site/figures
          cp reports/Q4_2026/data/*.json site/data/
          cp reports/Q4_2026/report_marimo/figures/brain_symphony_overview_diagram.jpeg site/figures/
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
